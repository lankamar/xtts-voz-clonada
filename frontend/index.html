<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LANKAMAR TTS — Síntesis de Voz</title>
  <meta name="description" content="Motor de texto a voz offline con clonación de voz usando XTTS v2. Proyecto de Lankamar.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* -------------------------------------------------------------------------
       Variables de diseño — modificar aquí para cambiar la paleta completa
    -------------------------------------------------------------------------- */
    :root {
      --bg-deep:      #0a0a14;
      --bg-card:      rgba(255, 255, 255, 0.04);
      --bg-input:     rgba(255, 255, 255, 0.06);
      --border:       rgba(255, 255, 255, 0.08);
      --accent:       #7c83fd;
      --accent-hover: #5a62d4;
      --accent-glow:  rgba(124, 131, 253, 0.3);
      --text-main:    #e8e8f0;
      --text-muted:   #7a7a9a;
      --ok:           #4ade80;
      --err:          #f87171;
      --loading:      #facc15;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(124,131,253,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(90,98,212,0.05) 0%, transparent 60%);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 640px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 20px 60px rgba(0,0,0,0.5);
    }

    .header { text-align: center; margin-bottom: 32px; }

    .logo {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 150px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea::placeholder { color: var(--text-muted); }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    button#btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    button#btn:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 4px 20px var(--accent-glow); }
    button#btn:active:not(:disabled) { transform: scale(0.99); }
    button#btn:disabled { background: rgba(124,131,253,0.3); cursor: not-allowed; }

    .status {
      margin-top: 14px;
      font-size: 0.85rem;
      text-align: center;
      color: var(--text-muted);
      min-height: 22px;
      transition: color 0.2s;
    }
    .status.ok      { color: var(--ok); }
    .status.err     { color: var(--err); }
    .status.loading { color: var(--loading); }

    audio { display: block; width: 100%; margin-top: 20px; border-radius: 8px; filter: invert(1) hue-rotate(200deg) brightness(0.85); }

    footer { margin-top: 28px; text-align: center; font-size: 0.75rem; color: var(--text-muted); }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <p class="logo">Lankamar</p>
      <h1>Síntesis de Voz</h1>
    </div>

    <label for="texto">Texto a sintetizar</label>
    <textarea
      id="texto"
      placeholder="Escribí el texto acá y presioná Generar Audio... (Ctrl+Enter para enviar)"
      autofocus
    ></textarea>

    <button id="btn" onclick="generar()">Generar Audio</button>

    <p class="status" id="estado" role="status" aria-live="polite"></p>

    <audio id="player" controls></audio>

    <footer>
      Motor: <strong>XTTS v2</strong> · 100% offline ·
      <a href="https://github.com/lankamar/xtts-voz-clonada" target="_blank">GitHub</a>
    </footer>
  </div>

  <script>
    async function generar() {
      const texto = document.getElementById('texto').value.trim();
      const btn   = document.getElementById('btn');
      const audio = document.getElementById('player');

      if (!texto) { setEstado('Escribí algo antes de generar.', 'err'); return; }

      btn.disabled = true;
      setEstado('Generando audio, esperá un momento...', 'loading');

      try {
        const respuesta = await fetch('/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: texto })
        });

        if (!respuesta.ok) {
          const mensajeError = await respuesta.text();
          throw new Error(mensajeError || `Error del servidor (HTTP ${respuesta.status})`);
        }

        const blob   = await respuesta.blob();
        const srcUrl = URL.createObjectURL(blob);
        audio.src = srcUrl;
        audio.play();
        setEstado('Audio generado correctamente.', 'ok');

      } catch (error) {
        setEstado('Error: ' + error.message, 'err');
        console.error('[LANKAMAR TTS] Error:', error);
      } finally {
        btn.disabled = false;
      }
    }

    function setEstado(mensaje, clase) {
      const el = document.getElementById('estado');
      el.textContent = mensaje;
      el.className   = 'status ' + (clase || '');
    }

    // Atajo: Ctrl+Enter para generar sin usar el mouse
    document.getElementById('texto').addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') generar();
    });
  </script>
</body>
</html>
