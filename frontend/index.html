<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XTTS - Voz Clonada</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 620px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #58a6ff;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 1rem;
      padding: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #58a6ff; }
    .row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      align-items: flex-end;
    }
    .field { flex: 1; }
    input[type=text] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 0.95rem;
      padding: 10px 12px;
      outline: none;
    }
    input[type=text]:focus { border-color: #58a6ff; }
    select {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 0.95rem;
      padding: 10px 12px;
      outline: none;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #2ea043; }
    button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
    .status {
      margin-top: 14px;
      font-size: 0.88rem;
      color: #8b949e;
      min-height: 20px;
    }
    .status.error { color: #f85149; }
    .status.ok { color: #3fb950; }
    audio {
      width: 100%;
      margin-top: 16px;
      border-radius: 8px;
    }
    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #484f58;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sintesis de voz clonada</h1>
    <p class="subtitle">XTTS v2 &mdash; API local en :5051</p>

    <label for="texto">Texto a sintetizar</label>
    <textarea id="texto" placeholder="Escribi el texto aca..."></textarea>

    <div class="row">
      <div class="field">
        <label for="speaker">Speaker (nombre del .wav)</label>
        <input type="text" id="speaker" value="marcelo" placeholder="marcelo">
      </div>
      <div class="field">
        <label for="lang">Idioma</label>
        <select id="lang">
          <option value="es" selected>Espanol (es)</option>
          <option value="en">English (en)</option>
          <option value="pt">Portugues (pt)</option>
          <option value="fr">Francais (fr)</option>
          <option value="de">Deutsch (de)</option>
          <option value="it">Italiano (it)</option>
          <option value="pl">Polski (pl)</option>
          <option value="ru">Русский (ru)</option>
          <option value="nl">Nederlands (nl)</option>
          <option value="cs">Cestina (cs)</option>
          <option value="ar">العربية (ar)</option>
          <option value="zh-cn">中文 (zh-cn)</option>
          <option value="ja">日本語 (ja)</option>
          <option value="hu">Magyar (hu)</option>
          <option value="ko">한국어 (ko)</option>
          <option value="tr">Turkce (tr)</option>
        </select>
      </div>
    </div>

    <button id="btn" onclick="generar()">Generar audio</button>

    <p class="status" id="status"></p>
    <audio id="player" controls style="display:none"></audio>

    <div class="footer">
      github.com/lankamar/xtts-voz-clonada &bull; MIT License
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:5051';

    async function generar() {
      const texto   = document.getElementById('texto').value.trim();
      const speaker = document.getElementById('speaker').value.trim() || 'marcelo';
      const lang    = document.getElementById('lang').value;
      const btn     = document.getElementById('btn');
      const status  = document.getElementById('status');
      const player  = document.getElementById('player');

      if (!texto) {
        setStatus('Escribi algo primero.', 'error');
        return;
      }

      btn.disabled = true;
      setStatus('Generando audio...');
      player.style.display = 'none';

      try {
        const res = await fetch(`${API}/tts_to_audio`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: texto, speaker_wav: speaker, language: lang })
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(`Error ${res.status}: ${err}`);
        }

        const blob = await res.blob();
        const url  = URL.createObjectURL(blob);
        player.src = url;
        player.style.display = 'block';
        player.play();
        setStatus('Audio generado correctamente.', 'ok');

      } catch (err) {
        setStatus(err.message, 'error');
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    // Enter para generar
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key === 'Enter') generar();
    });
  </script>
</body>
</html>
